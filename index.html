<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ===================================================================
         SEO -- Título e descrição principais do site.
         Estes valores são o "padrão" mostrado quando o link é partilhado sem
         que nenhuma página defina os seus próprios (ver src/hooks/useSeo.ts,
         usado por cada página para personalizar título/descrição/OG).
         =================================================================== -->
    <title>Idiomas & Tecnologia — Get Knowledge and Be Part Of Something Big!</title>
    <meta name="description" content="Formação de qualidade em Inglês, Francês, Mandarim, Espanhol, Russo e Português, presencial, online ou ao domicílio. Get Knowledge and Be Part Of Something Big!" />
    <meta name="theme-color" content="#0F2E29" />

    <!-- Open Graph (pré-visualização ao partilhar no WhatsApp/Facebook/Instagram) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Idiomas & Tecnologia" />
    <meta property="og:title" content="Idiomas & Tecnologia — Get Knowledge and Be Part Of Something Big!" />
    <meta property="og:description" content="Formação de qualidade em idiomas e tecnologia, com professores especializados e foco em resultados reais." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:locale" content="pt_PT" />

    <meta name="twitter:card" content="summary_large_image" />

    <!-- Tipografia da marca: Fraunces (títulos), IBM Plex Sans (corpo), IBM Plex Mono (preços/dados) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
